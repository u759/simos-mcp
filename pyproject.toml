[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "simosmcp"
version = "1.0.0"
description = "MCP server for Simos 18.1 ECU tuning — read, write, diff, and validate XDF/BIN files"
requires-python = ">=3.10"
dependencies = [
    "rapidfuzz>=3.0",
]

[project.scripts]
simosmcp = "server:main"

[tool.setuptools]
py-modules = ["server", "xdf_parser", "bin_ops", "fuzzy_search"]
